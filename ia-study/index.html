<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4aa2"><title>IA 入境事務助理｜考前溫習器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;background:#f4f8fd;color:#17233a;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}h1{color:#0b2d5b;font-size:24px}.bar{height:8px;background:#dce8f7;border-radius:99px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;width:10%;background:#0b5fc6;transition:width .2s}.muted{color:#65748b;font-size:14px}</style></head><body><div class="box"><h1>IA 入境事務助理｜考前溫習器</h1><div class="bar"><i id="p"></i></div><div id="s">正在載入完整題庫…</div><p class="muted">第一次開啟可能需要數秒。</p></div><script>(async()=>{try{let a=[];const base='https://raw.githubusercontent.com/chiholung-cmd/free-api-collection/main/ia-study/data/';for(let i=0;i<5;i++){document.getElementById('s').textContent=`正在載入題庫 ${i+1}/5…`;document.getElementById('p').style.width=((i+1)*20)+'%';let r=await fetch(base+i+'.txt?v=20260828');if(!r.ok)throw new Error('HTTP '+r.status);a.push(await r.text())}let h=a.join('');if(!h.includes('IA 入境事務助理')||!h.includes('</html>'))throw new Error('題庫資料不完整');document.open();document.write(h);document.close()}catch(e){document.getElementById('s').innerHTML='載入失敗。請重新整理頁面。<br><small>'+String(e)+'</small>';document.getElementById('p').style.background='#b73a3a'}})();</script></body></html>
