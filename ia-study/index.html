<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4aa2"><title>IA 入境事務助理｜考前溫習器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;background:#f4f8fd;color:#17233a;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}h1{color:#0b2d5b;font-size:24px}.bar{height:8px;background:#dce8f7;border-radius:99px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;width:5%;background:#0b5fc6;transition:width .2s}.muted{color:#65748b;font-size:14px}.err{color:#b73a3a}</style></head><body><div class="box"><h1>IA 入境事務助理｜考前溫習器</h1><div class="bar"><i id="p"></i></div><div id="s">正在載入完整題庫…</div><p class="muted">第一次開啟通常只需數秒。</p></div><script>(async()=>{const s=document.getElementById('s'),p=document.getElementById('p');try{if(!('DecompressionStream'in window))throw new Error('你的瀏覽器版本太舊，請用最新 Chrome 開啟。');let parts=[];for(let i=0;i<6;i++){s.textContent=`正在載入題庫 ${i+1}/6…`;p.style.width=((i+1)*12)+'%';const u=`https://raw.githubusercontent.com/chiholung-cmd/free-api-collection/main/ia-study/gz/${i}.txt?v=20260828-4`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`資料 ${i+1} 載入失敗 (${r.status})`);parts.push((await r.text()).trim())}s.textContent='正在解壓題庫…';p.style.width='86%';const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const byteSize=new TextEncoder().encode(html).length;if(byteSize!==85535||!html.startsWith('<!DOCTYPE html>')||!html.includes('const DATA=')||!html.includes('快問快答')||!html.endsWith('</html>'))throw new Error(`題庫完整性檢查失敗 (${byteSize} bytes)`);p.style.width='100%';s.textContent='載入完成';document.open();document.write(html);document.close()}catch(e){p.style.background='#b73a3a';s.className='err';s.innerHTML='載入失敗。請重新整理頁面。<br><small>'+String(e)+'</small>'}})();</script></body></html>
