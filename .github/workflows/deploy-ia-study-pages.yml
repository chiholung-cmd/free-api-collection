name: Deploy IA Study to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ia-study/**'
      - '.github/workflows/deploy-ia-study-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload IA study site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ia-study'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
